services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: acreditacion_medios
      MYSQL_ROOT_PASSWORD: acreditacion_local
    volumes:
      - acreditacion_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -pacreditacion_local --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: acreditacion_medios
      DB_USER: root
      DB_PASSWORD: acreditacion_local
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      CREDENTIAL_SECRET: ${CREDENTIAL_SECRET:-clave-local-cambiar-antes-de-publicar}

volumes:
  acreditacion_mysql_data:
